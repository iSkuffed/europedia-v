<noscript>Europedia V is a free Europa Universalis V (EU5) reference site built from the game files, covering production chains, pops, nations, the map, privileges, research, units and a land battle simulator. It needs JavaScript to run.</noscript>
<script type="module" src="/src/main.ts"></script>
<script>
  // GoatCounter: pages live in the hash, so count "#g/masonry" etc. as their own paths; filter settings after "?" don't count as new pages
  var gcPage = () => location.hash.split('?')[0];
  window.goatcounter = { path: p => p + gcPage() };
  var gcLast = gcPage();
  addEventListener('hashchange', () => { if (gcPage() !== gcLast && window.goatcounter.count) { gcLast = gcPage(); goatcounter.count(); } });
</script>
<script data-goatcounter="https://skuffedaf.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
