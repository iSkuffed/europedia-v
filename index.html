<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EU5 Reference — Production Chains</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  color-scheme: dark;
  /* EU5 UI: navy-slate panels, gold bevel frames, cream-gold titles, copper/purple header bands */
  --bg: #0d1117; --panel: #18202a; --panel2: #222c38; --band: #2a3546;
  --line: #3a3426; --frame: #8a6d3b; --frame-hi: #d8b46a;
  --text: #ebe1c8; --dim: #a39a84; --gold: #f0d58c;
  --in: #e48a5c; --out: #8fd16f; --pop: #82bde6;
  --serif: "Noto Serif", Georgia, "Liberation Serif", serif;
}
* { box-sizing: border-box; scrollbar-color: var(--frame) #0d1117; scrollbar-width: thin; }
body { margin: 0; background: radial-gradient(ellipse at top, #1a222d 0%, var(--bg) 70%) fixed; color: var(--text); font: 14px/1.45 var(--serif); }
input, button, summary { font: inherit; }
a { color: inherit; text-decoration: none; }
header { display: flex; gap: 16px; align-items: center; padding: 8px 16px; position: sticky; top: 0; z-index: 5;
  background: linear-gradient(#6a4528, #3b2414); border-bottom: 2px solid var(--frame); box-shadow: 0 2px 8px #000a; }
header h1 { font-size: 20px; margin: 0; color: var(--gold); letter-spacing: .5px; white-space: nowrap; text-shadow: 0 1px 2px #000; }
header nav a { color: #d9c9a3; padding: 4px 12px; border: 1px solid transparent; border-radius: 3px; }
header nav a.on { color: var(--gold); background: #0006; border-color: var(--frame); }
#search { flex: 1; max-width: 420px; background: #0d1117e6; color: var(--text); border: 1px solid var(--frame); border-radius: 18px; padding: 6px 14px; }
#search:focus { outline: none; border-color: var(--frame-hi); box-shadow: 0 0 0 1px var(--frame-hi); }
.layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 53px); }
aside { overflow-y: auto; border-right: 2px solid var(--frame); padding: 10px; background: #10161dcc; }
main { overflow-y: auto; padding: 16px 24px 60px; }
aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gold); margin: 16px 0 6px; padding: 3px 8px;
  background: linear-gradient(90deg, var(--band), transparent); border-left: 2px solid var(--frame); }
.grid { display: flex; flex-wrap: wrap; gap: 4px; }
.grid a { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 3px; background: linear-gradient(#26303d, #18202a); border: 1px solid var(--line); }
.grid a { position: relative; }
.grid a .pct.food { color: var(--out); }
.grid a .pct { position: absolute; right: 1px; bottom: 0; font-size: 10px; color: var(--gold); text-shadow: 0 0 2px #000, 0 0 2px #000; }
.grid a:hover, .grid a.on { border-color: var(--frame-hi); box-shadow: 0 0 6px #d8b46a66; }
.blist a { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 3px; }
.blist a:hover, .blist a.on { background: var(--panel2); color: var(--gold); }
img.ic, .ic-fb { width: 28px; height: 28px; object-fit: contain; flex: none; filter: drop-shadow(0 1px 1px #000c); }
.sm img.ic, .sm .ic-fb { width: 20px; height: 20px; }
.lg > img.ic, .lg > .ic-fb { width: 64px; height: 64px; font-size: 22px; }
.ic-fb { display: inline-grid; place-items: center; border-radius: 50%; background: var(--panel2); border: 1px solid var(--frame); color: var(--gold); font-size: 11px; font-weight: 600; }
.ic-fb.b { border-radius: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px 2px 3px; border-radius: 3px; margin: 2px; white-space: nowrap;
  background: linear-gradient(#2a3542, #1d2631); border: 1px solid #4a3f2a; }
.chip:hover { border-color: var(--frame-hi); color: var(--gold); }
.chip .n { color: var(--gold); font-variant-numeric: tabular-nums; }
.title { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; padding: 10px 14px; border: 1px solid var(--frame);
  background: linear-gradient(90deg, #2a2236, #18202a 60%); box-shadow: inset 0 0 0 1px #000, 0 2px 6px #0008; }
.popbar { flex: none; margin-left: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.popbar .flbl { font-size: 11px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; }
.popbar .row { display: flex; gap: 8px; }
.popbar .pd { display: flex; flex-direction: column; align-items: center; padding: 3px 6px; border: 1px solid var(--line); border-radius: 3px; background: #0d1117aa; text-decoration: none; }
.popbar .pd img.ic, .popbar .pd .ini { width: 36px; height: 36px; }
.popbar .tag { white-space: nowrap; }
.popbar .pd b { color: var(--pop); font-size: 13px; font-weight: 600; }
.popbar .pd.top { border-color: var(--frame-hi); box-shadow: 0 0 8px #d8b46a66; }
.popbar .pd.top b { color: var(--gold); }
.popbar .pd .big { font-size: 20px; color: var(--gold); font-weight: 600; line-height: 36px; }
.cnote { margin-top: 4px; font-size: 13px; color: var(--frame-hi); display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.popbar .pd.food { border-color: #6fae4a; box-shadow: 0 0 8px #8fd16f44; }
.popbar .pd.food .fv { display: flex; align-items: center; gap: 4px; }
.popbar .pd.food .big { color: var(--out); font-size: 24px; }
.popbar .pd.food b { color: var(--out); }
.popbar .pd.mul b { color: var(--in); }
.filters { margin-left: auto; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.fgroup { display: flex; align-items: center; gap: 5px; }
.flbl { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-right: 4px; }
.filters button { font-family: var(--serif); cursor: pointer; color: var(--gold); border: 1px solid var(--frame);
  background: radial-gradient(circle at 40% 35%, #34503a, #16241b); box-shadow: inset 0 0 0 1px #000, 0 1px 3px #000a; }
.filters button.age { width: 34px; height: 34px; border-radius: 50%; font-size: 14px; font-weight: 700; text-shadow: 0 1px 1px #000; }
.filters button.rec { height: 34px; padding: 0 6px; border-radius: 3px; display: flex; align-items: center; gap: 2px;
  background: linear-gradient(#2a3542, #1d2631); }
.filters button.rec img.ic { width: 24px; height: 24px; }
.filters button:hover:not(:disabled) { border-color: var(--frame-hi); }
.filters button.on { border: 2px solid var(--frame-hi); box-shadow: 0 0 8px #f0d58c99; background: radial-gradient(circle at 40% 35%, #7a6328, #3b2c10); color: #fff6d8; }
.filters button.rec.on { background: linear-gradient(#5a4a22, #2e2410); }
.filters button:disabled { opacity: .3; cursor: default; }
.title h2 { margin: 0; font-size: 28px; color: var(--gold); text-shadow: 0 2px 2px #000; }
.overview h2 { color: var(--gold); }
.meta { color: var(--dim); }
.meta span + span::before { content: " · "; }
/* wide full-width chain cards first, packed narrow cards after: uneven column ends fall at the page bottom */
.view > .cols { margin-top: 0 !important; margin-bottom: 16px; order: 1; }
.view > .masonry { order: 2; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: start; }
section.card { background: linear-gradient(#1b232e, #141a22); border: 1px solid var(--frame); border-radius: 2px; padding: 0 12px 10px;
  box-shadow: inset 0 0 0 1px #000, 0 2px 6px #0008; }
.view { display: flex; flex-direction: column; }
.masonry { display: flex; gap: 16px; align-items: flex-start; }
.masonry > .mcol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.empty-note { order: 9; margin-top: 16px; padding: 8px 12px; border-top: 1px solid var(--line); color: var(--dim); font-style: italic; font-size: 13px; }
.empty-note span + span::before { content: " · "; font-style: normal; }
section.card > h4 { margin: 0 -12px 8px; padding: 7px 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
  background: linear-gradient(90deg, var(--band), #1b232e); border-bottom: 1px solid var(--line); }
section.card > h4 { cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
section.card > h4::after { content: "▾"; color: var(--frame-hi); font-size: 16px; }
section.card.shut > h4 { margin-bottom: 0; border-bottom: none; }
section.card.shut > h4::after { content: "▸"; }
section.card.shut > :not(h4) { display: none; }
section.card.shut { padding-bottom: 0; }
h4.in { color: var(--in); } h4.out { color: var(--out); } h4.pop { color: var(--pop); } h4.gold { color: var(--gold); }
.rec { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; padding: 6px 0; border-top: 1px solid var(--line); }
.rec:first-of-type { border-top: none; }
.grp { padding: 6px 0; border-top: 1px solid var(--line); }
.grp:first-of-type { border-top: none; }
.grp .line { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; padding-left: 10px; }
.grp .line.rl { display: grid; grid-template-columns: 1fr auto; gap: 0; }
.grp .line .ins { display: flex; flex-wrap: wrap; }
.grp .line .outp { display: flex; align-items: center; }
.grp .line .rname { width: auto; min-width: 150px; }
.arrow { color: var(--frame-hi); margin: 0 4px; }
.ugrp { display: grid; grid-template-columns: 1fr 18em; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.ugrp:first-of-type { border-top: none; }
.ugrp .who { display: flex; flex-wrap: wrap; gap: 2px; padding-right: 10px; border-right: 2px solid var(--frame-hi); }
.ugrp .need { display: flex; align-items: center; padding-left: 8px; white-space: nowrap; }
.rname { width: 100%; font-size: 12px; color: var(--dim); font-style: italic; }
.none { color: var(--dim); font-style: italic; }
details { margin: 4px 0; }
summary { cursor: pointer; color: #c9bc9c; }
summary:hover { color: var(--gold); }
.crow { display: flex; align-items: flex-start; gap: 4px; padding: 6px 0; border-top: 1px solid var(--line); }
.crow:first-of-type { border-top: none; }
.crow > .chip { flex: none; }
.crow .arrow { flex: none; padding-top: 6px; }
.crow .opts { display: flex; flex-direction: column; gap: 2px; }
.crow.up { flex-direction: column; gap: 6px; }
.crow.up > .opts { align-self: stretch; }
.crow.up > .opts > .fx { width: auto; }
.crow.up > .chip { border: none; background: none; padding: 0; font-size: 16px; color: var(--gold); letter-spacing: .3px; }
.crow.up > .hdr { font-size: 16px; color: var(--gold); letter-spacing: .3px; line-height: 28px; }
.crow.up > .chip img.ic { width: 28px; height: 28px; }
.fx:has(> .trow) { display: grid; grid-template-columns: max-content 1fr; column-gap: 8px; }
.fx:has(> .trow) > .fl { grid-column: 1 / -1; }
.fx:has(> .trow) > .trow { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; }
.crow .opt { display: flex; flex-wrap: wrap; align-items: center; }
.crow .opts.row { flex-direction: row; flex-wrap: wrap; }
.chip.ico { padding: 2px 6px 2px 2px; gap: 3px; }
.or { min-width: 18px; }
.crow .opts .arrow { padding-top: 0; margin: 0 1px; }
.crow.raw { border-top: 1px solid var(--frame); margin-top: 4px; }
.crow .lbl { flex: none; color: var(--gold); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; padding-top: 7px; margin-right: 6px; }
.or { color: var(--dim); font-style: italic; font-size: 12px; margin: 0 6px; }
.fx { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; width: fit-content; padding: 4px 8px 6px;
  border: 1px solid #6b5a33; border-radius: 4px; background: #ffffff06; }
.crow .opts > .fx + .fx { margin-top: 4px; }
.fx .fl, .fx .tl { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--gold); }
.fx .tl { color: var(--frame-hi); margin-top: 2px; }
.fx .tl:empty { display: none; }
.og, .og1 { display: inline-flex; align-items: center; flex-wrap: wrap; }
.og { border: 1px dashed #6b5a33; border-radius: 4px; padding: 1px 3px; }
.term { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
.fx .with { color: var(--dim); font-style: italic; font-size: 12px; margin-left: 6px; }
.fx .fl.hd { display: flex; align-items: center; gap: 8px; }
.fx .fl.hd .bis { margin: 0; }
.fx .trow { display: flex; align-items: center; gap: 8px; }
.fx .trow.any { flex-direction: column; align-items: flex-start; gap: 3px; }
.fx .trow:not(.any) + .trow { border-top: 1px solid var(--line); padding-top: 3px; }
.fx .trow:not(.any) .tl { display: flex; flex-wrap: wrap; gap: 2px; max-width: 104px; flex: none; padding-right: 8px; border-right: 2px solid var(--frame-hi); margin: 0; align-self: stretch; align-items: center; }
.bi { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; background: #0d1117aa; padding: 1px; }
.bsep { width: 1px; align-self: stretch; background: var(--frame); margin: 2px 3px; }
.bi:hover { border-color: var(--frame-hi); }
.bi img.ic, .bi .ic-fb { width: 22px; height: 22px; }
.bis { display: flex; gap: 2px; margin-top: 2px; }
.fx .fr { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.fx.either .fr { align-items: flex-start; }
.fx.either { display: inline-flex; border-color: var(--frame-hi); background: #ffffff08; padding: 2px 6px 4px; }
.agetag { color: var(--gold); font-size: 12px; min-width: 64px; margin-right: 4px; white-space: nowrap; }
.em { display: inline-flex; flex-direction: column; align-items: center; }
.em .agetag.mini { margin: 0; line-height: 1.1; }
.agetag.mini { min-width: 0; margin: 0 0 0 3px; font-size: 11px; }
.agetag.solo { margin-left: 8px; min-width: 0; }

.opt .tag { margin: 2px 0 0; }
table.pops { border-collapse: collapse; width: 100%; }
table.pops td { padding: 3px 6px; border-top: 1px solid var(--line); }
table.pops td.n { text-align: right; font-variant-numeric: tabular-nums; color: var(--out); }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 2px; background: #0d1117; border: 1px solid var(--line); color: var(--dim); }
a.tag:hover { color: var(--gold); border-color: var(--frame); }
.overview .card { margin-bottom: 16px; }

/* EU5-style tooltip */
#tip { position: fixed; z-index: 100; pointer-events: none; max-width: 380px; min-width: 200px; display: none;
  background: linear-gradient(#1d2631, #131921); border: 1px solid var(--frame); outline: 1px solid #000; border-radius: 3px;
  box-shadow: 0 6px 18px #000c, inset 0 0 0 1px #ffffff0a; font-size: 14px; color: var(--text); }
#tip .th { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: linear-gradient(90deg, #2e2618, #1b1a17); border-bottom: 1px solid var(--frame); }
#tip .th img.ic, #tip .th .ic-fb { width: 40px; height: 40px; }
#tip .th b { display: block; font-size: 17px; color: var(--gold); text-shadow: 0 1px 2px #000; }
#tip .th i { color: var(--pop); font-size: 13px; }
#tip .tb { padding: 4px 0; }
#tip .tr { display: flex; align-items: center; gap: 8px; padding: 3px 12px; }
#tip .tr:nth-child(odd) { background: #ffffff06; }
#tip .tr img.ic { width: 22px; height: 22px; }
#tip .tr .v { margin-left: auto; color: var(--out); white-space: nowrap; }
#tip .tr .req { color: var(--in); }
#tip .tr .v.bad { color: #e06060; }
#tip .tt { padding: 6px 12px; }
#tip .tn { padding: 6px 12px; color: var(--dim); font-style: italic; font-size: 13px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>EU5 Reference</h1>
  <nav><a href="#" class="on">Production Chains</a></nav>
  <input id="search" placeholder="Search goods or buildings…  (/)" list="names" autocomplete="off">
  <datalist id="names"></datalist>
</header>
<div class="layout">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<script src="data.js"></script>
<script>
const {goods: G, buildings: B, demands: D, pops: P, cats: CATS, units: U, demandRefs: DREF} = DATA;
const HAS = Object.fromEntries(Object.entries(DATA.icons).map(([k, v]) => [k, new Set(v)]));
const fmt = n => n == null ? '' : (Math.abs(n) < 0.01 ? +n.toPrecision(2) : +n.toFixed(3)).toString();  // keep tiny demands readable
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

function icon(kind, id, label) {
  if (HAS[kind]?.has(id)) return `<img class="ic" src="icons/${kind}/${id}.png" alt="" title="${esc(label)}">`;
  const ab = label.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  return `<span class="ic-fb ${kind === 'buildings' ? 'b' : ''}" title="${esc(label)}">${esc(ab)}</span>`;
}
const gChip = (g, n) => `<a class="chip" href="#g/${g}">${icon('goods', g, G[g]?.name || g)}${esc(G[g]?.name || g)}${n != null ? ` <span class="n">${fmt(n)}</span>` : ''}</a>`;
// compact: icon + amount, name in tooltip (for dense recipe lines)
const gIco = (g, n) => `<a class="chip ico" href="#g/${g}" title="${esc(G[g]?.name || g)}">${icon('goods', g, G[g]?.name || g)}${n != null ? `<span class="n">${fmt(n)}</span>` : ''}</a>`;
const bChip = b => `<a class="chip" href="#b/${b}">${icon('buildings', b, B[b].name)}${esc(B[b].name)}</a>`;
const uChip = u => `<span class="chip" title="${esc(U[u].age ? U[u].age.replace(/^age_\d_/, '').replace(/_/g, ' ') + ' age' : '')}">${icon('units', U[u].cat, U[u].name)}${esc(U[u].name)}</span>`;
// demand groups that aren't a single pop type get the game's generic icons
const PGROUP = {all: ['all_pops', 'All pops'], upper: ['strata', 'Upper strata']};
const pName = p => PGROUP[p]?.[1] || P[p] || p;
const pIcon = p => PGROUP[p] ? `<img class="ic" src="icons/misc/${PGROUP[p][0]}.png" alt="${esc(pName(p))}">` : icon('pops', p, pName(p));
const pChip = p => `<span class="chip">${pIcon(p)}${esc(pName(p))}</span>`;

// ---- indexes ---------------------------------------------------------------
const producers = {}, consumers = {}, maint = {}, demandUse = {};
for (const [bid, b] of Object.entries(B)) for (const r of b.recipes) {
  if (r.out) (producers[r.out] ??= []).push([bid, r]);
  for (const g in r.in) ((r.out ? consumers : maint)[g] ??= []).push([bid, r]);
}
const buildBy = {};  // construction demand id -> buildings
for (const [bid, b] of Object.entries(B)) if (b.build) (buildBy[b.build] ??= []).push(bid);
for (const [did, d] of Object.entries(D)) for (const g in d.in) (demandUse[g] ??= []).push(did);
const unitsBy = {};  // demand id -> visible unit types using it (hidden templates only if nothing else)
for (const [uid, u] of Object.entries(U)) for (const d of new Set(Object.values(u.dem))) (unitsBy[d] ??= []).push(uid);
for (const d in unitsBy) {
  const vis = unitsBy[d].filter(u => !U[u].hide);
  unitsBy[d] = (vis.length ? vis : unitsBy[d]).sort((a, b) => U[a].name.localeCompare(U[b].name));
}
const UNIT_CATS = new Set(['regiment_construction', 'regiment_maintenance', 'ship_construction', 'ship_maintenance', 'ship_repair']);
const chipList = (chips, max = 8) => chips.length <= max ? chips.join('')
  : chips.slice(0, max).join('') + `<details style="display:inline"><summary class="tag" style="display:inline">+${chips.length - max} more</summary>${chips.slice(max).join('')}</details>`;
// who uses a goods_demand entry: buildings (construction), unit types, or other script objects (laws, orders…)
const demandUsers = d => [...(buildBy[d] || []).map(bChip), ...(unitsBy[d] || []).map(uChip),
  ...(DREF[d] || []).map(r => `<span class="chip"><span class="tag">${esc(r.f.replace(/_/g, ' '))}</span>${esc(r.name)}</span>`)];

const DCAT = {
  building_construction: 'Building construction', building_maintenance: 'Upkeep',
  regiment_construction: 'Army recruitment', regiment_maintenance: 'Army upkeep',
  ship_construction: 'Ship construction', ship_maintenance: 'Ship upkeep', ship_repair: 'Ship repair',
  special_demands: 'Special demands', government_activities: 'Government activities',
};
const METHOD = {farming: 'Farming', mining: 'Mining', hunting: 'Hunting', gathering: 'Gathering', forestry: 'Forestry'};
const pretty = id => id.replace(/_(construction|maintenance|repair|demands?|input)$/,'').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

function recipeRow(bid, r) {  // single recipe, building shown inline
  const ins = Object.entries(r.in).map(([g, n]) => gChip(g, n)).join('') || '<span class="none">nothing</span>';
  const out = r.out ? `<span class="arrow">→</span>${gChip(r.out, r.amt)}` : '';
  return `<div class="rec">${r.name ? `<div class="rname">${esc(r.name)}</div>` : ''}${ins}<span class="arrow">→</span>${bChip(bid)}${out}</div>`;
}
function recipeGroups(list) {  // [[bid, recipe]] grouped under each building: inputs → output per line
  const by = {};
  for (const [bid, r] of list) (by[bid] ??= []).push(r);
  return Object.entries(by).map(([bid, rs]) => `<div class="grp">${bChip(bid)}${rs.map(r =>
    `<div class="line rl"><span class="ins">${Object.entries(r.in).map(([g, n]) => gIco(g, n)).join('') || '<span class="none">no inputs</span>'}</span>${r.out ? `<span class="outp"><span class="arrow">→</span>${gIco(r.out, r.amt)}</span>` : ''}</div>`).join('')}</div>`).join('');
}

// ---- chain trees -----------------------------------------------------------
// ---- page filters (good pages only): age = what's available in that age, rec = recipe variant of the viewed good
let F = {on: false, g: null, age: null, rec: null};
const obsoletedBy = {};
for (const [bid, b] of Object.entries(B)) if (b.obsolete) (obsoletedBy[b.obsolete] ??= []).push(bid);
// available in age A: unlocked by then and not already replaced by a newer tier that is also unlocked
const availB = (bid, A) => B[bid].age <= A && !(obsoletedBy[bid] || []).some(o => B[o].age <= A);
const okR = ([bid, r], A = F.on && F.age) => !A || (availB(bid, A) && (r.age || 1) <= A);
const matchesVariant = (r, v) => v.every(i => i in r.in);
function prod(g, A) {
  let ps = (producers[g] || []).filter(p => okR(p, A));
  if (F.on && g === F.g && F.rec != null) ps = ps.filter(([, r]) => matchesVariant(r, variants(g)[F.rec]));
  return ps;
}
const cons = g => (consumers[g] || []).filter(p => okR(p));
const minimalSets = sets => sets.filter(s => !sets.some(o => o.length < s.length && o.every(i => s.includes(i))));
const distinctSets = list => [...new Map(list.map(([, r]) => Object.keys(r.in).sort()).filter(s => s.length).map(s => [s.join('+'), s])).values()];
const variants = g => minimalSets(distinctSets(producers[g] || []));  // unfiltered, so the buttons stay stable

// recipe options for a good: distinct input sets, reduced to the minimal ones (alternatives);
// inputs only found in non-minimal sets are reported separately as "extra"
function inputOptions(g) {
  const sets = distinctSets(prod(g));
  const mins = minimalSets(sets);
  const core = new Set(mins.flat());
  return {mins, extra: [...new Set(sets.flat())].filter(i => !core.has(i))};
}
const isLeaf = g => G[g].cat === 'raw_material' || !prod(g).length;
// small linked building icons (oldest tier first); hover gives the building tooltip
// upgrade chains in tier order (longest chain first); single buildings come last
function orderB(bids) {
  const set = new Set(bids), chains = [];
  for (const root of set) {
    if (set.has(B[root].obsolete)) continue;  // not the start of a chain
    const c = [root];
    for (let n; (n = (obsoletedBy[c.at(-1)] || []).find(o => set.has(o) && !c.includes(o)));) c.push(n);
    chains.push(c);
  }
  return chains.sort((a, b) => (b.length > 1) - (a.length > 1) || b.length - a.length || B[a[0]].age - B[b[0]].age || B[a[0]].name.localeCompare(B[b[0]].name));
}
// small linked building icons; hover gives the building tooltip; a divider before standalone buildings
function bIcons(bids) {
  const chains = orderB(bids), link = b => `<a class="bi" href="#b/${b}">${icon('buildings', b, B[b].name)}</a>`;
  const multi = chains.filter(c => c.length > 1), solo = chains.filter(c => c.length === 1);
  return [...multi.map(c => c.map(link).join('')), solo.map(c => link(c[0])).join('')].filter(Boolean).join('<span class="bsep"></span>');
}
// How a good is made, from every recipe that makes it (not just the minimal ones):
// "always" = inputs (or swappable groups like Lumber / Leather) that every recipe uses;
// rows = buildings with the same remaining options, in upgrade order, each listing its recipes.
function recipeView(g) {
  const ps = prod(g), key = s => [...s].sort().join('+');
  const sets = [...new Map(ps.map(([, r]) => [key(Object.keys(r.in)), Object.keys(r.in)])).values()].filter(s => s.length);
  const K = new Set(sets.map(key)), all = [...new Set(sets.flat())];
  const up = Object.fromEntries(all.map(i => [i, i])), find = x => up[x] === x ? x : (up[x] = find(up[x]));
  for (const s of sets) for (const x of s) for (const y of all)  // x and y are swappable if trading one for the other gives another recipe
    if (!s.includes(y) && K.has(key([...s.filter(i => i !== x), y]))) up[find(y)] = find(x);
  let members = {};
  for (const i of all) (members[find(i)] ??= []).push(i);
  let tok = i => members[find(i)].length > 1 ? 'G:' + find(i) : i;
  // groups are only kept if every combination they imply is a real recipe and nothing is lost
  const expand = t => t.reduce((acc, x) => acc.flatMap(a => (x.startsWith('G:') ? members[x.slice(2)] : [x]).map(i => [...a, i])), [[]]);
  const back = new Set(sets.flatMap(s => expand([...new Set(s.map(tok))])).map(key));
  if (back.size !== K.size || ![...back].every(k => K.has(k))) { members = Object.fromEntries(all.map(i => [i, [i]])); tok = i => i; }
  const T = s => [...new Set(s.map(tok))];
  const always = sets.length ? T(sets[0]).filter(t => sets.every(s => T(s).includes(t))) : [];
  const byB = new Map();
  for (const [bid, r] of ps) {
    const o = T(Object.keys(r.in)).filter(t => !always.includes(t));
    if (!byB.has(bid)) byB.set(bid, new Map());
    byB.get(bid).set(key(o), o);
  }
  const groups = new Map();
  for (const [bid, opts] of byB) {
    const k = [...opts.keys()].sort().join('|');
    if (!groups.has(k)) groups.set(k, {opts: [...opts.values()].sort((a, b) => a.length - b.length || key(a).localeCompare(key(b))), bids: []});
    groups.get(k).bids.push(bid);
  }
  const order = orderB([...byB.keys()]).flat(), pos = r => Math.min(...r.bids.map(b => order.indexOf(b)));
  const allB = new Set(byB.keys());
  const span = i => { const bs = [...allB].filter(b => [...byB.get(b).values()].some(o => o.includes(tok(i))) || always.includes(tok(i)) && ps.some(([x, r]) => x === b && i in r.in));
    return bs.length < allB.size ? bIcons(bs) : ''; };  // building tag for an Either option not every producer can use
  return {always, rows: [...groups.values()].sort((a, b) => pos(a) - pos(b)), members, span, allB};
}
// panel titles explain themselves on hover
const TERMS = {
  'Always': 'Every recipe for this good uses these. The icons next to the title are the buildings that make it.',
  'Either': 'Use any one of these. If an option has building icons under it, only those buildings can use it.',
  'Plus, by building': 'Some buildings need more than the Always inputs. Each row shows buildings on the left and what they add on the right. "or" means the building can run either recipe. Buildings that need nothing extra are not listed.',
  'By building': 'No input is shared by every recipe, so each building\'s recipes are shown in full. Buildings on the same row use the same recipes. "or" means the building can run either recipe.',
};
const term = t => `<span class="term" data-tip="${esc(TERMS[t] || '')}">${t}</span>`;
function optsHtml(g) {
  const {always, rows, members, span, allB} = recipeView(g);
  if (!rows.length) return '';
  const PLUS = '<span class="arrow">+</span>';
  const either = x => `<span class="fx either"><span class="fl">${term('Either')}</span><span class="fr">${
    members[x.slice(2)].map(i => span(i) ? `<span class="em">${gChip(i)}<span class="bis">${span(i)}</span></span>` : gChip(i)).join('')}</span></span>`;
  // plain goods first, then Either boxes, joined with +
  const chips = ts => [...ts].sort((a, b) => a.startsWith('G:') - b.startsWith('G:')).map(x => x.startsWith('G:') ? either(x) : gChip(x)).join(PLUS);
  const head = label => `<span class="fl hd">${term(label)}<span class="bis">${bIcons([...allB])}</span></span>`;
  let out = always.length ? `<div class="fx">${head('Always')}<span class="fr">${chips(always)}</span></div>` : '';
  // a building whose only recipe is exactly the Always inputs adds nothing; its icon is already in the Always header
  const extra = rows.filter(r => r.opts.length > 1 || r.opts[0].length);
  if (extra.length) {
    const opt = (o, many) => !o.length ? '<span class="none">nothing extra</span>'
      : `<span class="${many && o.length > 1 ? 'og' : 'og1'}">${always.length ? PLUS : ''}${chips(o)}</span>`;
    out += `<div class="fx">${always.length ? `<span class="fl">${term('Plus, by building')}</span>` : head('By building')}${extra.map(r =>
      `<span class="trow"><span class="tl">${bIcons(r.bids)}</span><span class="fr">${r.opts.map(o => opt(o, r.opts.length > 1)).join('<span class="or">or</span>')}</span></span>`).join('')}</div>`;
  }
  return out;
}

// upstream: every produced good in the dependency closure once, as "good ← options"; raw materials listed last
function upChain(g) {
  if (isLeaf(g)) return '';
  const seen = new Set([g]), q = [g], rows = [], raw = [];
  while (q.length) {
    const x = q.shift();
    if (isLeaf(x)) { raw.push(x); continue; }
    const o = inputOptions(x);
    rows.push(`<div class="crow up">${gChip(x)}<span class="opts">${optsHtml(x)}</span></div>`);
    for (const i of [...new Set([...o.mins.flat(), ...o.extra])].sort()) if (!seen.has(i)) { seen.add(i); q.push(i); }
  }
  return rows.join('') + `<div class="crow up raw"><span class="hdr">Raw materials (RGO)</span><span class="opts"><div class="fx"><span class="fr">${raw.map(i => gChip(i)).join('')}</span></div></span></div>`;
}
// downstream: every good reachable by processing, once, as "good → outputs" (depth-limited)
function downChain(g, depth = 3) {
  const seen = new Set([g]), rows = [];
  let level = [g];
  for (let d = 0; d < depth && level.length; d++) {
    const next = [];
    for (const x of level) {
      // raw outputs (tools → fish via fishing villages etc.) are extraction inputs, not processing — skip them
      const outs = [...new Set(cons(x).map(([, r]) => r.out))].filter(o => G[o].cat !== 'raw_material').sort((a, b) => G[a].name.localeCompare(G[b].name));
      if (!outs.length) continue;
      rows.push(`<div class="crow">${gChip(x)}<span class="arrow">→</span><span class="opts row">${outs.map(o => gChip(o)).join('')}</span></div>`);
      for (const o of outs) if (!seen.has(o)) { seen.add(o); next.push(o); }
    }
    level = next;
  }
  return rows.join('');
}

// ---- views -----------------------------------------------------------------
// [body, heading, emptyText][] -> cards with content first, empty ones after (stable order)
// filled cards pack into columns; empty ones collapse into one line pushed to the page bottom (CSS order)
// [body, heading, emptyText][]: filled cards render; empty ones only add their text to EMPTY,
// which route() shows as one line below everything
let EMPTY = [];
const keep = list => { EMPTY.push(...list.filter(c => !c[0]).map(c => c[2])); return list.filter(c => c[0]); };
const cards = list => `<div class="masonry">${keep(list).map(([body, h]) => `<section class="card">${h}${body}</section>`).join('')}</div>`;
const wide = list => { const k = keep(list); return k.length ? `<div class="cols">${k.map(([body, h]) => `<section class="card">${h}${body}</section>`).join('')}</div>` : ''; };
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI'];
function filterBar(g) {
  if (!producers[g]) return '';
  const ages = Object.keys(DATA.ages).map(Number).map(a => {
    const n = (producers[g] || []).filter(p => okR(p, a)).length;
    return `<button class="age${F.age === a ? ' on' : ''}" data-f="age" data-v="${a}" ${n ? '' : 'disabled'}
      title="Age ${ROMAN[a]}: ${esc(DATA.ages[a])}${n ? '' : ' — not producible yet'}">${ROMAN[a]}</button>`;
  }).join('');
  const vs = variants(g);
  const recs = vs.length > 1 ? `<div class="fgroup"><span class="flbl">Recipe</span>${vs.map((v, k) =>
    `<button class="rec${F.rec === k ? ' on' : ''}" data-f="rec" data-v="${k}" title="${esc(v.map(i => G[i].name).join(' + '))}">${v.map(i => icon('goods', i, G[i].name)).join('')}</button>`).join('')}</div>` : '';
  return `<div class="filters"><div class="fgroup"><span class="flbl">Age</span>${ages}</div>${recs}</div>`;
}
document.getElementById('main').addEventListener('click', e => {
  const h = e.target.closest('section.card > h4');
  if (h) return h.parentElement.classList.toggle('shut');
  const b = e.target.closest('button[data-f]');
  if (!b) return;
  const v = +b.dataset.v;
  F[b.dataset.f] = F[b.dataset.f] === v ? null : v;  // click the active one again to clear
  keepScroll = true;
  location.hash = `g/${F.g}` + filterQuery();
});
let keepScroll = false;
const filterQuery = () => { const q = [F.age && `age=${F.age}`, F.rec != null && `rec=${F.rec}`].filter(Boolean).join('&'); return q ? '?' + q : ''; };

// upkeep users grouped by per-building amount, largest first
function upkeepGroups(g, ms) {
  const by = {};
  for (const [b, r] of ms) (by[r.in[g]] ??= new Set()).add(b);
  return Object.entries(by).sort((a, b) => b[0] - a[0]).map(([n, bs]) =>
    `<div class="ugrp"><div class="who">${chipList([...bs].map(b => bChip(b)), 24)}</div>
    <div class="need"><span class="arrow">each needs →</span>${gChip(g, +n)}</div></div>`).join('');
}

// pop classes that buy this good, biggest consumer first and highlighted
// construction: how many buildings need this good to be built; CORE = needed by ≥20% of buildings (masonry, lumber, tools, glass)
const BUILT = Object.values(B).filter(b => D[b.build]).length, conUse = {};
for (const b of Object.values(B)) for (const g in D[b.build]?.in || {}) conUse[g] = (conUse[g] || 0) + 1;
const pct = g => Math.round(100 * (conUse[g] || 0) / BUILT);
const CORE = Object.keys(conUse).filter(g => pct(g) >= 20).sort((a, b) => conUse[b] - conUse[a]);
const feedsCore = g => CORE.filter(c => c !== g && (producers[c] || []).some(([, r]) => g in r.in));
// food value per unit, ranked against every other food good
const FOODS = Object.keys(G).filter(g => G[g].food).sort((a, b) => G[b].food - G[a].food);
const APPLE = '<img class="ic" src="icons/misc/food.png" alt="Food">';
function foodBar(g) {
  const f = G[g].food;
  if (!f) return '';
  const rank = FOODS.findIndex(o => G[o].food === f) + 1;  // ties share the best rank
  return `<div class="popbar"><span class="flbl">Food</span><div class="row"><span class="pd food" title="Each unit provides ${fmt(f)} food; food drives pop growth">
    <span class="fv">${APPLE}<span class="big">${fmt(f)}</span></span><b>#${rank} of ${FOODS.length} foods</b></span></div></div>`;
}
function conBar(g) {
  if (!conUse[g]) return '';
  return `<div class="popbar"><span class="flbl">Construction</span><div class="row"><span class="pd${CORE.includes(g) ? ' top' : ''}"
    title="Needed to construct ${conUse[g]} of ${BUILT} building types"><span class="big">${pct(g)}%</span><b>${conUse[g]} buildings</b></span></div></div>`;
}
function conNote(g) {
  const f = feedsCore(g);
  return (CORE.includes(g) ? `<div class="cnote">Core construction material — needed to build ${conUse[g]} of ${BUILT} building types, so its price feeds directly into building costs.</div>` : '')
    + (f.length ? `<div class="cnote">Input for construction material${f.length > 1 ? 's' : ''}: ${f.map(c => gChip(c)).join('')}</div>` : '');
}

function popBar(x) {
  const d = Object.entries(x.demand).sort((a, b) => b[1] - a[1]);
  const m = Object.entries(x.demandMul).filter(([, n]) => n).sort((a, b) => b[1] - a[1]);
  if (!d.length && !m.length) return '';
  const pd = (p, txt, cls, tip) => `<span class="pd${cls}" title="${esc(pName(p) + tip)}">${pIcon(p)}<b>${txt}</b></span>`;
  return `<div class="popbar"><span class="flbl">Pop demand</span><div class="row">${
    d.map(([p, n], i) => i === 0 && d.length > 1 ? pd(p, `+${fmt(n)}`, ' top', `: +${fmt(n)} — biggest consumer`) : pd(p, `+${fmt(n)}`, '', `: +${fmt(n)}`)).join('')}${
    m.map(([p, n]) => pd(p, `×${fmt(n)}`, ' mul', `: demand ×${fmt(n)}`)).join('')}</div></div>`;
}

function goodView(g) {
  const x = G[g];
  const ps = prod(g), cs = cons(g), ms = (maint[g] || []).filter(p => okR(p)), ds = demandUse[g] || [];
  const meta = [x.cat === 'raw_material' ? `Raw material — ${METHOD[x.method] || x.method}` : 'Produced good',
    `Base price ${fmt(x.price)}`, x.slave ? 'Slave good' : ''].filter(Boolean);

  let made = x.cat === 'raw_material'
    ? `<div class="rec"><span class="tag">RGO</span>&nbsp;Extracted from locations whose raw material is ${esc(x.name)} (${esc(METHOD[x.method] || x.method)})</div>` : '';
  made += recipeGroups(ps);

  const pops = Object.entries(x.demand).map(([p, n]) =>
    `<tr><td>${pChip(p)}</td><td class="n">+${fmt(n)}</td></tr>`).join('');
  const muls = Object.entries(x.demandMul).map(([p, n]) =>
    `<tr><td>${pChip(p)}</td><td class="n">×${fmt(n)}</td></tr>`).join('');

  const demCard = filter => {
    const byCat = {};
    for (const d of ds.filter(filter)) (byCat[D[d].cat] ??= []).push(d);
    return Object.entries(byCat).map(([c, list]) => `<details ${list.length < 8 ? 'open' : ''}><summary>${esc(DCAT[c] || c)} (${list.length})</summary>
      ${list.map(d => {
        const who = demandUsers(d);
        return `<div class="rec">${who.length ? chipList(who) : `<span>${esc(pretty(d))}</span>`}<span class="arrow">needs</span>${gChip(g, D[d].in[g])}</div>`;
      }).join('')}</details>`).join('');
  };
  const unitDem = demCard(d => UNIT_CATS.has(D[d].cat)), dem = demCard(d => !UNIT_CATS.has(D[d].cat));

  return `<div class="title lg">${icon('goods', g, x.name)}<div><h2>${esc(x.name)}</h2><div class="meta">${meta.map(m => `<span>${esc(m)}</span>`).join('')}</div>${conNote(g)}</div>${foodBar(g)}${conBar(g)}${popBar(x)}${filterBar(g)}</div>
  ${cards([
    [made, '<h4 class="out">Produced by</h4>', 'No building produces this.'],
    [recipeGroups(cs), '<h4 class="in">Input for production</h4>', 'Not an input for any production method.'],
    [pops || muls || x.food ? `${pops || muls ? `<table class="pops">${pops}${muls}</table>` : ''}
      ${x.food ? `<div class="rec">${APPLE}&nbsp;Provides ${fmt(x.food)} food per unit</div>` : ''}` : '', '<h4 class="pop">Consumed by pops</h4>', 'No direct pop demand.'],
    [unitDem, '<h4 class="in">Army &amp; navy (recruit, upkeep, repair)</h4>', 'Not used by any unit.'],
    [dem, '<h4 class="gold">Construction &amp; other demand</h4>', 'None.'],
  ])}
  ${wide([
    [upChain(g), `<h4 class="in">Upstream — what it takes to make ${esc(x.name)}</h4>`, 'Raw material, extracted by RGOs.'],
    [downChain(g), `<h4 class="out">Downstream — what ${esc(x.name)} becomes</h4>`, 'Not processed into any other good.'],
    [upkeepGroups(g, ms), '<h4 class="gold">Building upkeep — amount is per building</h4>', 'Not used as building upkeep.'],
  ])}`;
}

function buildingView(bid) {
  const b = B[bid];
  const prod = b.recipes.filter(r => r.out), up = b.recipes.filter(r => !r.out);
  const outs = [...new Set(prod.map(r => r.out))];
  const replaces = b.obsolete && B[b.obsolete] ? bChip(b.obsolete) : '';
  const replacedBy = Object.entries(B).filter(([, o]) => o.obsolete === bid).map(([k]) => bChip(k)).join('');
  const meta = [CATS[b.cat] || b.cat, b.pop ? `Employs ${P[b.pop] || b.pop}` : '', b.foreign ? 'Can be built abroad' : ''].filter(Boolean);
  const restrict = reqLines(b).map(([k, v]) => `<div class="cnote"><span class="tag">${esc(k)}</span>${esc(v)} only</div>`).join('')
    + (b.event ? `<div class="cnote">${EVENT_NOTE}</div>` : '');
  const build = b.build && D[b.build] ? Object.entries(D[b.build].in).map(([g, n]) => gChip(g, n)).join('') : '';
  return `<div class="title lg">${icon('buildings', bid, b.name)}<div><h2>${esc(b.name)}</h2><div class="meta">${meta.map(m => `<span>${esc(m)}</span>`).join('')}</div>${restrict}</div></div>
  ${cards([
    [recipeGroups(prod.map(r => [bid, r])), '<h4 class="out">Production methods</h4>', 'Produces no goods.'],
    [outs.map(o => {
      const cs = [...new Set((consumers[o] || []).map(([k]) => k))];
      const pd = Object.keys(G[o].demand);
      const us = [...new Set((demandUse[o] || []).flatMap(d => unitsBy[d] || []))];
      const other = (demandUse[o] || []).filter(d => !unitsBy[d]).length;
      return `<div class="grp">${gChip(o)}
        ${cs.length ? `<div class="line"><span class="arrow">buildings</span>${chipList(cs.map(bChip))}</div>` : ''}
        ${pd.length ? `<div class="line"><span class="arrow">pops</span>${pd.map(p => p === 'all' ? '<span class="tag">all pops</span>' : p === 'upper' ? '<span class="tag">upper strata</span>' : pChip(p)).join('')}</div>` : ''}
        ${us.length ? `<div class="line"><span class="arrow">units</span>${chipList(us.map(uChip))}</div>` : ''}
        ${other ? `<div class="line"><a class="tag" href="#g/${o}">+${other} construction / upkeep / other demands →</a></div>` : ''}</div>`;
    }).join(''), '<h4 class="pop">Output is used by</h4>', '—'],
    [up.map(r => `<div class="rec">${r.name ? `<div class="rname">${esc(r.name)}</div>` : ''}${Object.entries(r.in).map(([g, n]) => gChip(g, n)).join('') || '<span class="none">none</span>'}</div>`).join(''), '<h4 class="gold">Upkeep</h4>', 'No goods upkeep.'],
    [build + (replaces ? `<div class="rec"><span class="arrow">Replaces</span>${replaces}</div>` : '')
      + (replacedBy ? `<div class="rec"><span class="arrow">Replaced by</span>${replacedBy}</div>` : ''), '<h4 class="gold">Construction</h4>', 'No goods cost listed.'],
  ])}
  ${wide(outs.map(o => [downChain(o), `<h4 class="out">Downstream — what ${esc(G[o].name)} becomes</h4>`, `${esc(G[o].name)} is not processed into any other good.`]))}`;
}

function overview() {
  return `<div class="overview"><h2>Production Chains</h2>
  <p class="meta">Pick a good or building on the left, or search. Every icon is clickable. Data extracted from the installed game files.</p>
  <section class="card"><h4 class="gold">How to read it</h4>
  <div class="rec">${gChip('wool', 1)}<span class="arrow">→</span>${bChip('cloth_guild')}<span class="arrow">→</span>${gChip('cloth', 1)}</div>
  <p class="meta">Inputs (amount per building level) → building → output. Raw materials come from location RGOs; produced goods come from buildings.</p></section></div>`;
}

// ---- sidebar / routing -----------------------------------------------------
function sidebar() {
  const grp = {};
  for (const [g, x] of Object.entries(G)) {
    const k = x.cat === 'produced' ? 'Produced goods' : x.food ? 'Food' : `Raw — ${METHOD[x.method] || x.method}`;
    (grp[k] ??= []).push(g);
  }
  const order = ['Produced goods', 'Food', ...Object.keys(grp).filter(k => k.startsWith('Raw')).sort()];
  let h = `<h3 title="Share of building types that need this good to be built">Construction materials</h3><div class="grid">${Object.keys(conUse).filter(g => pct(g) >= 5)
    .sort((a, b) => conUse[b] - conUse[a]).map(g => `<a href="#g/${g}" data-k="g/${g}" title="${esc(G[g].name)} — needed to build ${conUse[g]} of ${BUILT} building types">${icon('goods', g, G[g].name)}<span class="pct">${pct(g)}%</span></a>`).join('')}</div>`;
  h += order.filter(k => grp[k]).map(k => `<h3>${k}</h3><div class="grid">${grp[k].sort(k === 'Food' ? (a, b) => G[b].food - G[a].food : (a, b) => G[a].name.localeCompare(G[b].name))
    .map(g => `<a href="#g/${g}" data-k="g/${g}" title="${esc(G[g].name)}${k === 'Food' ? ` — ${fmt(G[g].food)} food` : ''}">${icon('goods', g, G[g].name)}${k === 'Food' ? `<span class="pct food">${fmt(G[g].food)}</span>` : ''}</a>`).join('')}</div>`).join('');
  const bg = {};
  for (const [bid, b] of Object.entries(B)) if (b.recipes.some(r => r.out)) (bg[CATS[b.cat] || b.cat] ??= []).push(bid);
  h += `<h3>Producing buildings</h3>` + Object.keys(bg).sort().map(c => `<details><summary>${esc(c)} (${bg[c].length})</summary><div class="blist sm">${bg[c].sort((a, b) => B[a].name.localeCompare(B[b].name))
    .map(b => `<a href="#b/${b}" data-k="b/${b}">${icon('buildings', b, B[b].name)}${esc(B[b].name)}</a>`).join('')}</div></details>`).join('');
  document.getElementById('side').innerHTML = h;
  document.getElementById('names').innerHTML = [...Object.entries(G).map(([, x]) => x.name), ...Object.values(B).map(b => b.name)]
    .map(n => `<option value="${esc(n)}">`).join('');
}

// distribute cards (in priority order) into N columns, each card going to the currently shortest column
function layoutMasonry() {
  for (const m of document.querySelectorAll('.masonry')) {
    const cards = [...m.querySelectorAll(':scope > .card, :scope > .mcol > .card')];
    const n = Math.max(1, Math.min(cards.length, Math.floor((m.clientWidth + 16) / 356)));
    const cols = Array.from({length: n}, () => Object.assign(document.createElement('div'), {className: 'mcol'}));
    m.replaceChildren(...cols);
    for (const c of cards) cols.reduce((a, b) => b.offsetHeight < a.offsetHeight ? b : a).append(c);
    m.replaceChildren(...cols.sort((a, b) => b.offsetHeight - a.offsetHeight));  // longest column on the left
  }
}
let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layoutMasonry, 100); });

function route() {
  const [path, query = ''] = location.hash.slice(1).split('?');
  const [t, id] = path.split('/');
  const qs = new URLSearchParams(query);
  const main = document.getElementById('main');
  EMPTY = [];
  // filters come from the URL (?age=&rec=); age carries over when following plain links to other goods
  if (t === 'g') {
    F.rec = qs.has('rec') ? +qs.get('rec') : null;
    if (qs.has('age') || id === F.g) F.age = qs.has('age') ? +qs.get('age') : null;
  }
  F.on = t === 'g'; F.g = t === 'g' ? id : F.g;
  const body = t === 'g' && G[id] ? goodView(id) : t === 'b' && B[id] ? buildingView(id) : overview();
  main.innerHTML = `<div class="view">${body}${EMPTY.length ? `<div class="empty-note">${EMPTY.map(e => `<span>${e}</span>`).join('')}</div>` : ''}</div>`;
  layoutMasonry();
  if (!keepScroll) main.scrollTop = 0;
  keepScroll = false;
  document.querySelectorAll('aside .on').forEach(e => e.classList.remove('on'));
  const cur = document.querySelector(`aside [data-k="${t}/${id}"]`);
  if (cur) { cur.classList.add('on'); cur.closest('details')?.setAttribute('open', ''); }
}

const search = document.getElementById('search');
search.addEventListener('change', () => {
  const q = search.value.trim().toLowerCase();
  const g = Object.keys(G).find(k => G[k].name.toLowerCase() === q) || Object.keys(G).find(k => G[k].name.toLowerCase().includes(q));
  const b = !g && (Object.keys(B).find(k => B[k].name.toLowerCase() === q) || Object.keys(B).find(k => B[k].name.toLowerCase().includes(q)));
  if (g) location.hash = `g/${g}`; else if (b) location.hash = `b/${b}`;
  search.value = '';
});
addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== search) { e.preventDefault(); search.focus(); } });
addEventListener('hashchange', route);

// ---- tooltips: rich cards for goods/buildings, styled text for anything with a title -------------------
const tip = Object.assign(document.createElement('div'), {id: 'tip'});
document.body.append(tip);
const tRow = (label, v, ic = '') => `<div class="tr">${ic}<span>${label}</span>${v != null ? `<span class="v">${v}</span>` : ''}</div>`;
const tHead = (ic, name, sub) => `<div class="th">${ic}<div><b>${esc(name)}</b>${sub ? `<i>${esc(sub)}</i>` : ''}</div></div>`;
function goodTip(g) {
  const x = G[g], ps = producers[g] || [], cs = consumers[g] || [];
  const top = Object.entries(x.demand).sort((a, b) => b[1] - a[1])[0];
  return tHead(icon('goods', g, x.name), x.name, x.cat === 'raw_material' ? `Raw material — ${METHOD[x.method] || x.method}` : 'Produced good')
    + `<div class="tb">${tRow('Base price', fmt(x.price))}
    ${x.food ? tRow('Food per unit', fmt(x.food), APPLE) : ''}
    ${conUse[g] ? tRow('Needed to construct', `${conUse[g]} buildings (${pct(g)}%)`) : ''}
    ${top ? tRow(`Biggest pop consumer: ${esc(pName(top[0]))}`, '+' + fmt(top[1]), pIcon(top[0])) : ''}
    ${tRow('Made by', [x.cat === 'raw_material' && 'RGO', ps.length && `${new Set(ps.map(p => p[0])).size} buildings`].filter(Boolean).join(' + ') || '—')}
    ${tRow('Input for', `${new Set(cs.map(p => p[0])).size} buildings`)}</div>`
    + (CORE.includes(g) ? '<div class="tn">Core construction material — its price feeds into building costs.</div>' : '');
}
// "Nation: Muscovy or Russia" lines from build.py's identity requirements
const reqLines = b => Object.entries(b.req.reduce((m, [k, v]) => ((m[k] ??= []).push(v), m), {})).map(([k, vs]) => [k, vs.join(' or ')]);
const EVENT_NOTE = 'Not built through normal construction — granted by events or decisions';
function buildingTip(bid) {
  const b = B[bid], outs = [...new Set(b.recipes.filter(r => r.out).map(r => r.out))];
  return tHead(icon('buildings', bid, b.name), b.name, CATS[b.cat] || b.cat)
    + `<div class="tb">${b.pop ? tRow(`Employs ${esc(P[b.pop] || b.pop)}`, null, icon('pops', b.pop, P[b.pop] || b.pop)) : ''}
    ${tRow('Available from', `Age ${ROMAN[b.age]} — ${esc(DATA.ages[b.age] || '')}`)}
    ${outs.length ? tRow('Produces', outs.map(o => icon('goods', o, G[o]?.name || o)).join('')) : ''}
    ${reqLines(b).map(([k, v]) => tRow(`<span class="req">${esc(k)}</span>`, esc(v))).join('')}
    ${tRow('Production methods', b.recipes.length)}
    ${B[b.obsolete] ? tRow('Replaces', esc(B[b.obsolete].name)) : ''}
    ${obsoletedBy[bid]?.length ? tRow('Replaced by', obsoletedBy[bid].map(o => esc(B[o].name)).join(', ')) : ''}</div>`
    + (b.event ? `<div class="tn">${EVENT_NOTE}.</div>` : '');
}
function tipFor(el) {
  const h = el.getAttribute('href') || '';
  if (h.startsWith('#g/') && G[h.slice(3)]) return goodTip(h.slice(3));
  if (h.startsWith('#b/') && B[h.slice(3)]) return buildingTip(h.slice(3));
  return el.dataset.tip ? `<div class="tt">${esc(el.dataset.tip)}</div>` : '';
}
let tipEl = null;
document.addEventListener('mouseover', e => {
  // a goods/building link wins over the name-only title on its own icon
  const el = e.target.closest('a[href^="#g/"], a[href^="#b/"]') || e.target.closest('[title], [data-tip]');
  if (e.target !== el && e.target.title) { e.target.dataset.tip = e.target.title; e.target.removeAttribute('title'); }
  if (el === tipEl) return;  // still on the same entry: keep the tooltip exactly as first shown
  tipEl = el;
  if (el?.title) { el.dataset.tip = el.title; el.removeAttribute('title'); }  // suppress the native tooltip
  const html = el && tipFor(el);
  if (!html) return tip.style.display = 'none';
  // measure at the left edge so the natural size isn't squeezed by the viewport, then lock it
  Object.assign(tip.style, {display: 'block', width: '', left: '0px', top: '0px'});
  tip.innerHTML = html;
  tip.style.width = tip.getBoundingClientRect().width + 'px';
  placeTip(e);
});
function placeTip(e) {
  const r = tip.getBoundingClientRect(), x = e.clientX + 18, y = e.clientY + 18;
  tip.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
  tip.style.top = Math.max(8, y + r.height > innerHeight ? e.clientY - r.height - 12 : y) + 'px';
}
document.addEventListener('mousemove', e => { if (tip.style.display !== 'none') placeTip(e); });
addEventListener('hashchange', () => { tip.style.display = 'none'; tipEl = null; });
sidebar(); route();
</script>
</body>
